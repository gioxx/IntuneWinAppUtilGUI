name: PowerShell Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # The module supports both PowerShell 7 (pwsh) and Windows PowerShell 5.1 (powershell).
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    name: test (${{ matrix.shell }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Pester
        shell: ${{ matrix.shell }}
        run: Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Validate module manifest
        shell: ${{ matrix.shell }}
        run: Test-ModuleManifest -Path ./IntuneWinAppUtilGUI.psd1

      - name: Run tests
        shell: ${{ matrix.shell }}
        run: Invoke-Pester -Path ./Tests -CI
