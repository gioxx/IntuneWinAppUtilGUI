name: Publish to PowerShell Gallery

# Publishes when a GitHub release is published, from the commit its tag points to.
# `released` fires for a stable release and for a pre-release promoted to stable;
# drafts and pre-releases publish nothing, so a release can be prepared and reviewed first.
on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  POShGallery-Publish:
    runs-on: windows-latest

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # The version is set in the PR that prepares the release (psd1, UI.xaml, tests);
      # the release tag must match it, so the wrong code is never published under a version.
      - name: Check that the tag matches the module version
        shell: pwsh
        run: |
          $tagVersion = '${{ github.event.release.tag_name }}' -replace '^v', ''  # e.g. "v1.0.0" -> "1.0.0"
          $moduleVersion = (Import-PowerShellDataFile -Path (Join-Path $PWD 'IntuneWinAppUtilGUI.psd1')).ModuleVersion
          if ($moduleVersion -ne $tagVersion) {
              throw "Release tag $tagVersion does not match ModuleVersion $moduleVersion in IntuneWinAppUtilGUI.psd1."
          }

      - name: Validate module manifest
        shell: pwsh
        run: |
          $psd1Path = Join-Path $PWD 'IntuneWinAppUtilGUI.psd1'
          Test-ModuleManifest -Path $psd1Path -Verbose

      - name: Prepare module package
        shell: pwsh
        run: |
          $outDir = Join-Path $PWD 'build'
          $moduleName = 'IntuneWinAppUtilGUI'
          $moduleDir = Join-Path $outDir $moduleName

          if (Test-Path $outDir) { Remove-Item -Recurse -Force $outDir }
          New-Item -ItemType Directory -Path $moduleDir -Force | Out-Null

          $includeFiles = @(
            "$moduleName.psd1",
            "$moduleName.psm1",
            "README.md"
          )
          
          foreach ($file in $includeFiles) {
            if (Test-Path $file) { Copy-Item -Path $file -Destination $moduleDir -Force }
          }

          $foldersToInclude = @("Private", "Public", "Assets", "UI")
          foreach ($folder in $foldersToInclude) {
            if (Test-Path $folder) { Copy-Item -Path $folder -Destination $moduleDir -Recurse -Force }
          }

      - name: Publish module to PowerShell Gallery
        shell: pwsh
        run: |
          $modulePath = Join-Path $PWD 'build' | Join-Path -ChildPath 'IntuneWinAppUtilGUI'

          if (-not (Get-PSRepository -Name 'PSGallery' -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Name 'PSGallery' -SourceLocation 'https://www.powershellgallery.com/api/v2' -InstallationPolicy Trusted
          }

          Publish-Module -Path $modulePath `
                         -NuGetApiKey "${{ secrets.NUGET_API_KEY }}" `
                         -Verbose
